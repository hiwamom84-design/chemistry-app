    async function processRealIdCardPhoto(imageDataUrl) {
      const scanBox = document.getElementById('idCardScanBox');
      const img = document.getElementById('idCardImagePreview');
      const statusText = document.getElementById('idCardScanStatusText');
      const subText = document.getElementById('idCardScanSubText');
      const progressBar = document.getElementById('ocrProgressBar');
      const extractedBadge = document.getElementById('ocrExtractedProfileBadge');
      const nameDisplay = document.getElementById('verifiedScannedNameDisplay');
      const idNumDisplay = document.getElementById('ocrExtractedIdNum');
      const extraInfoDisplay = document.getElementById('verifiedScannedExtraInfo');

      if (img) img.src = imageDataUrl;
      if (scanBox) scanBox.classList.remove('hidden');
      if (extractedBadge) extractedBadge.classList.add('hidden');
      if (progressBar) progressBar.style.width = '15%';

      if (statusText) statusText.textContent = 'گەڕانی ورد لە وێنە بۆ دۆزینەوەی QR کۆدی ناسنامە...';
      if (subText) subText.textContent = 'پشکنینی چڕ لەسەر کۆدە چوارگۆشەییەکانی ناسنامە (Deep QR Search)...';

      const tempImg = new Image();
      tempImg.onload = async function() {
        if (progressBar) progressBar.style.width = '35%';
        if (statusText) statusText.textContent = 'شیکردنەوەی خاڵەکانی QR کۆد (High-Resolution Pass)...';

        let detectedPayload = null;

        if ('BarcodeDetector' in window) {
          try {
            const barcodeDetector = new BarcodeDetector({ formats: ['qr_code', 'data_matrix', 'code_128', 'pdf417'] });
            const barcodes = await barcodeDetector.detect(tempImg);
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              detectedPayload = barcodes[0].rawValue.trim();
            }
          } catch (e) {}
        }

        if (!detectedPayload && window.jsQR) {
          if (progressBar) progressBar.style.width = '50%';
          detectedPayload = runJsQRPass(tempImg, 1.0, false);
        }

        if (!detectedPayload && window.jsQR && (tempImg.width > 1200 || tempImg.height > 1200)) {
          if (progressBar) progressBar.style.width = '65%';
          const scale = 1000 / Math.max(tempImg.width, tempImg.height);
          detectedPayload = runJsQRPass(tempImg, scale, false);
        }

        if (!detectedPayload && window.jsQR) {
          if (progressBar) progressBar.style.width = '80%';
          detectedPayload = runJsQRPass(tempImg, 0.8, true);
        }

        if (progressBar) progressBar.style.width = '100%';

        let extractedName = '';
        let extractedId = 'IQ-' + Math.floor(1000000 + Math.random() * 9000000);

        if (detectedPayload) {
          if (statusText) statusText.textContent = 'QR کۆد بە سەرکەوتوویی دۆزرایەوە و خوێندرایەوە!';
          if (subText) subText.textContent = 'دەرهێنانی ناوی قوتابی لە زانیارییە شفرەکراوەکان...';

          extractedName = parseNameFromQRPayload(detectedPayload);
          if (idNumDisplay) idNumDisplay.textContent = 'QR-SUCCESS';
          if (extraInfoDisplay) extraInfoDisplay.textContent = 'دۆزراوە لە QR کۆد: ' + (detectedPayload.length > 30 ? detectedPayload.substring(0, 30) + '...' : detectedPayload);
        } else {
          if (statusText) statusText.textContent = 'وێنەی ناسنامە بە سەرکەوتوویی شیکار کرا!';
          if (subText) subText.textContent = 'خوێندنەوەی دەقی ڕاستەوخۆ لەسەر کارتەکە...';
          
          if (window.Tesseract && typeof Tesseract.recognize === 'function') {
            try {
              const ocrRes = await Tesseract.recognize(imageDataUrl, 'ara+fas+eng');
              if (ocrRes && ocrRes.data && ocrRes.data.lines) {
                for (let l of ocrRes.data.lines) {
                  const clean = l.text.replace(/[0-9\-_:;!?.()\/\\|]/g, '').trim();
                  const words = clean.split(/\s+/).filter(w => w.length > 1);
                  if (words.length >= 2 && !clean.includes('عراق') && !clean.includes('جمهوری') && !clean.includes('هویة') && !clean.includes('کارت')) {
                    extractedName = words.slice(0, 4).join(' ');
                    break;
                  }
                }
              }
            } catch (err) {}
          }

          if (!extractedName) {
            extractedName = 'قوتابی پۆلی ١١ی زانستی';
          }
          if (idNumDisplay) idNumDisplay.textContent = 'CARD-SCAN';
          if (extraInfoDisplay) extraInfoDisplay.textContent = 'خوێندراوە لە وێنەی ناسنامەکەت';
        }

        currentScannedStudentName = extractedName.trim();
        currentScannedStudentId = extractedId;

        if (nameDisplay) nameDisplay.textContent = currentScannedStudentName;
        if (extractedBadge) extractedBadge.classList.remove('hidden');
      };
      tempImg.src = imageDataUrl;
    }

    function runJsQRPass(imgEl, scale, enhanceContrast) {
      try {
        const canvas = document.createElement('canvas');
        const w = Math.round(imgEl.naturalWidth * scale);
        const h = Math.round(imgEl.naturalHeight * scale);
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgEl, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);

        if (enhanceContrast) {
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const v = (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
            const thresh = v > 128 ? 255 : 0;
            d[i] = thresh;
            d[i+1] = thresh;
            d[i+2] = thresh;
          }
          ctx.putImageData(imgData, 0, 0);
        }

        const code = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: "attemptBoth"
        });

        if (code && code.data) {
          return code.data.trim();
        }
      } catch (err) {}
      return null;
    }

    function parseNameFromQRPayload(payload) {
      if (!payload) return 'قوتابی پۆلی ١١ی زانستی';

      try {
        const parsed = JSON.parse(payload);
        if (parsed.name) return String(parsed.name).trim();
        if (parsed.fullName) return String(parsed.fullName).trim();
        if (parsed.student) return String(parsed.student).trim();
        if (parsed.student_name) return String(parsed.student_name).trim();
        if (parsed.n) return String(parsed.n).trim();
      } catch (e) {}

      if (payload.includes('FN:')) {
        const m = payload.match(new RegExp('FN:([^\r\n]+)', 'i'));
        if (m && m[1]) return m[1].trim();
      }
      if (payload.includes('N:')) {
        const m = payload.match(new RegExp('N:([^\r\n]+)', 'i'));
        if (m && m[1]) return m[1].replace(/;/g, ' ').trim();
      }

      const kv = payload.match(new RegExp('(?:Name|ناو|ناوی قوتابی|Student|Full Name)\\s*[:=]\\s*([^\r\n,;]+)', 'i'));
      if (kv && kv[1]) return kv[1].trim();

      if (payload.includes('?') && (payload.includes('name=') || payload.includes('student='))) {
        try {
          const url = new URL(payload);
          const pName = url.searchParams.get('name') || url.searchParams.get('student');
          if (pName) return decodeURIComponent(pName).replace(/\\+/g, ' ').trim();
        } catch (e) {}
      }

      const lines = payload.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length > 0 && !lines[0].startsWith('http') && !/^[0-9]+$/.test(lines[0])) {
        return lines[0];
      }

      return payload.length > 35 ? payload.substring(0, 35) : payload;
    }

    function bigGcd(a, b) {
      a = a < 0n ? -a : a;
      b = b < 0n ? -b : b;
      while (b !== 0n) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    function bigLcm(a, b) {
      if (a === 0n || b === 0n) return 0n;
      return (a * b) / bigGcd(a, b);
    }

    class Fraction {
      constructor(n, d = 1n) {
        n = BigInt(n);
        d = BigInt(d);
        if (d === 0n) throw new Error("Division by zero in Fraction");
        if (d < 0n) { n = -n; d = -d; }
        const g = bigGcd(n, d);
        this.n = n / g;
        this.d = d / g;
      }
      add(o) { return new Fraction(this.n * o.d + o.n * this.d, this.d * o.d); }
      sub(o) { return new Fraction(this.n * o.d - o.n * this.d, this.d * o.d); }
      mul(o) { return new Fraction(this.n * o.n, this.d * o.d); }
      div(o) { return new Fraction(this.n * o.d, this.d * o.n); }
      isZero() { return this.n === 0n; }
      isPositive() { return this.n > 0n; }
      isNegative() { return this.n < 0n; }
      neg() { return new Fraction(-this.n, this.d); }
    }

    const KNOWN_ELEMENT_MAP = {};
    if (typeof ALL_ELEMENTS !== 'undefined' && Array.isArray(ALL_ELEMENTS)) {
      ALL_ELEMENTS.forEach(el => { KNOWN_ELEMENT_MAP[el.s] = el; });
    }

    function parseFormula(rawFormula) {
      rawFormula = cleanFormulaForBalancing(rawFormula);
      const formula = rawFormula.replace(/^\s*\d+\s*/, "").trim();
      if (!formula) throw new Error("پێکهاتەی کیمیایی بەتاڵە.");

      function parseGroup(s) {
        const counts = {};
        let i = 0;
        const n = s.length;
        while (i < n) {
          const c = s[i];
          if (c === "(" || c === "[" || c === "{") {
            const closeChar = c === "(" ? ")" : (c === "[" ? "]" : "}");
            let depth = 1;
            let j = i + 1;
            while (j < n && depth > 0) {
              if (s[j] === c) depth++;
              else if (s[j] === closeChar) depth--;
              j++;
            }
            if (depth > 0) throw new Error(`کەوانەکان لە (${s}) ناڕێکن.`);
            const inner = parseGroup(s.substring(i + 1, j - 1));
            const numMatch = s.substring(j).match(/^\d+/);
            let mult = 1;
            if (numMatch) {
              mult = parseInt(numMatch[0], 10);
              j += numMatch[0].length;
            }
            for (const [el, cnt] of Object.entries(inner)) {
              counts[el] = (counts[el] || 0) + cnt * mult;
            }
            i = j;
          } else if (c === ")" || c === "]" || c === "}") {
            throw new Error(`کەوانەی ناڕێک دۆزرایەوە لە: ${s}`);
          } else {
            const m = s.substring(i).match(/^([A-Z][a-z]?)(\d*)/);
            if (!m) throw new Error(`پیت یان هێمای نادروست لە: "${s.substring(i)}"`);
            const el = m[1];
            if (Object.keys(KNOWN_ELEMENT_MAP).length > 0 && !KNOWN_ELEMENT_MAP[el]) {
              throw new Error(`هێمای کیمیایی نادیار لە خشتەی خولیدا: "${el}"`);
            }
            const cnt = m[2] ? parseInt(m[2], 10) : 1;
            counts[el] = (counts[el] || 0) + cnt;
            i += m[0].length;
          }
        }
        return counts;
      }

      return parseGroup(formula);
    }

    function formatFormulaHtml(formula) {
      return formula.replace(/([A-Za-z\)\]\}])(\d+)/g, "$1<sub>$2</sub>");
    }

    function calculateMolarMass(atomCounts) {
      let total = 0;
      for (const [el, cnt] of Object.entries(atomCounts)) {
        const info = KNOWN_ELEMENT_MAP[el];
        if (info && info.m) {
          total += info.m * cnt;
        }
      }
      return total;
    }

    function balanceChemicalEquation(equationStr) {
      equationStr = cleanFormulaForBalancing(equationStr);
      if (!equationStr || !equationStr.trim()) {
        throw new Error("تکایە هاوکێشەیەکی کیمیایی بنووسە.");
      }
      const parts = equationStr.split(/\s*(?:->|-->|=>|==>|=|→|⇄|⇌)\s*/);
      if (parts.length !== 2) {
        throw new Error("تکایە تیشکی کارلێک (-> یان =) بنووسە لە نێوان کارلێککەرەکان و بەرهەمەکاندا.");
      }
      const rRaw = parts[0].split("+").map(s => s.trim()).filter(Boolean);
      const pRaw = parts[1].split("+").map(s => s.trim()).filter(Boolean);
      if (rRaw.length === 0 || pRaw.length === 0) {
        throw new Error("پێویستە هاوکێشەکە لانیکەم یەک کارلێککەر و یەک بەرهەمی هەبێت.");
      }

      const rClean = rRaw.map(s => s.replace(/^\s*\d+\s*/, "").trim());
      const pClean = pRaw.map(s => s.replace(/^\s*\d+\s*/, "").trim());

      const rParsed = rClean.map(parseFormula);
      const pParsed = pClean.map(parseFormula);

      const elementsSet = new Set();
      rParsed.forEach(obj => Object.keys(obj).forEach(el => elementsSet.add(el)));
      pParsed.forEach(obj => Object.keys(obj).forEach(el => elementsSet.add(el)));
      const allElements = Array.from(elementsSet).sort();

      const rElements = new Set();
      rParsed.forEach(obj => Object.keys(obj).forEach(el => rElements.add(el)));
      const pElements = new Set();
      pParsed.forEach(obj => Object.keys(obj).forEach(el => pElements.add(el)));

      const missingInP = Array.from(rElements).filter(el => !pElements.has(el));
      const missingInR = Array.from(pElements).filter(el => !rElements.has(el));
      if (missingInP.length > 0 || missingInR.length > 0) {
        const errs = [];
        if (missingInP.length > 0) errs.push(`توخمی (${missingInP.join(", ")}) لە بەرهەمەکاندا نییە.`);
        if (missingInR.length > 0) errs.push(`توخمی (${missingInR.join(", ")}) لە کارلێککەرەکاندا نییە.`);
        throw new Error(errs.join(" "));
      }

      const numCompounds = rClean.length + pClean.length;
      const numElements = allElements.length;

      const M = [];
      for (const el of allElements) {
        const row = [];
        for (const r of rParsed) {
          row.push(new Fraction(r[el] || 0));
        }
        for (const p of pParsed) {
          row.push(new Fraction(-(p[el] || 0)));
        }
        M.push(row);
      }

      const nrows = numElements;
      const ncols = numCompounds;
      const rref = M.map(row => row.slice());
      let r = 0;
      const pivotCols = [];

      for (let c = 0; c < ncols; c++) {
        if (r >= nrows) break;
        let pivotRow = -1;
        for (let i = r; i < nrows; i++) {
          if (!rref[i][c].isZero()) {
            pivotRow = i;
            break;
          }
        }
        if (pivotRow === -1) continue;

        const tmp = rref[r];
        rref[r] = rref[pivotRow];
        rref[pivotRow] = tmp;

        const pv = rref[r][c];
        rref[r] = rref[r].map(val => val.div(pv));

        for (let i = 0; i < nrows; i++) {
          if (i !== r && !rref[i][c].isZero()) {
            const factor = rref[i][c];
            rref[i] = rref[i].map((val, k) => val.sub(factor.mul(rref[r][k])));
          }
        }
        pivotCols.push(c);
        r++;
      }

      const freeCols = [];
      for (let c = 0; c < ncols; c++) {
        if (!pivotCols.includes(c)) freeCols.push(c);
      }
      if (freeCols.length === 0) {
        throw new Error("ناتوانرێت هاوسەنگ بکرێت: هیچ شیکارێکی ناسیفر بوونی نییە.");
      }

      const nullVectors = [];
      for (const f of freeCols) {
        const vec = [];
        for (let j = 0; j < ncols; j++) vec.push(new Fraction(0));
        vec[f] = new Fraction(1);
        for (let rowIdx = 0; rowIdx < pivotCols.length; rowIdx++) {
          const pCol = pivotCols[rowIdx];
          vec[pCol] = rref[rowIdx][f].neg();
        }
        nullVectors.push(vec);
      }

      let solution = null;
      if (nullVectors.length === 1) {
        const v = nullVectors[0];
        if (v.every(x => x.isPositive())) solution = v;
        else if (v.every(x => x.isNegative())) solution = v.map(x => x.neg());
      } else {
        for (const maxC of [1, 2, 5, 10, 20]) {
          function searchComb(idx, current) {
            if (solution) return;
            if (idx === nullVectors.length) {
              const cand = [];
              for (let j = 0; j < ncols; j++) {
                let sum = new Fraction(0);
                for (let k = 0; k < nullVectors.length; k++) {
                  sum = sum.add(nullVectors[k][j].mul(new Fraction(current[k])));
                }
                cand.push(sum);
              }
              if (cand.every(x => x.isPositive())) {
                solution = cand;
              }
              return;
            }
            for (let val = 1; val <= maxC; val++) {
              current[idx] = val;
              searchComb(idx + 1, current);
              if (solution) return;
            }
          }
          searchComb(0, new Array(nullVectors.length));
          if (solution) break;
        }
      }

      if (!solution) {
        throw new Error("ناتوانرێت هاوکێشەکە هاوسەنگ بکرێت بە هاوکۆڵکەی ئەرێنی.");
      }

      let overallLcm = 1n;
      for (const x of solution) {
        overallLcm = bigLcm(overallLcm, x.d);
      }
      const intCoeffs = solution.map(x => (x.n * (overallLcm / x.d)));
      let overallGcd = 0n;
      for (const c of intCoeffs) {
        overallGcd = bigGcd(overallGcd, c);
      }
      const finalCoeffs = intCoeffs.map(c => Number(c / overallGcd));

      const atomCounts = {};
      for (const el of allElements) {
        let left = 0;
        for (let i = 0; i < rClean.length; i++) {
          left += finalCoeffs[i] * (rParsed[i][el] || 0);
        }
        let right = 0;
        for (let j = 0; j < pClean.length; j++) {
          right += finalCoeffs[rClean.length + j] * (pParsed[j][el] || 0);
        }
        if (left !== right) {
          throw new Error(`هەڵە لە هاوسەنگی ئەتۆمەکانی ${el}: کارلێککەر=${left}، بەرهەم=${right}`);
        }
        atomCounts[el] = left;
      }

      function formatCompoundText(coeff, formula) {
        const cStr = coeff === 1 ? "" : String(coeff);
        return `${cStr}${formula}`;
      }
      function formatCompoundHtml(coeff, formula) {
        const cStr = coeff === 1 ? "" : `<span class="text-cyan-400 font-black">${coeff}</span>`;
        return `${cStr}${formatFormulaHtml(formula)}`;
      }

      const rStr = rClean.map((f, i) => formatCompoundText(finalCoeffs[i], f)).join(" + ");
      const pStr = pClean.map((f, j) => formatCompoundText(finalCoeffs[rClean.length + j], f)).join(" + ");

      const rHtml = rClean.map((f, i) => formatCompoundHtml(finalCoeffs[i], f)).join(' <span class="text-slate-400 font-bold">+</span> ');
      const pHtml = pClean.map((f, j) => formatCompoundHtml(finalCoeffs[rClean.length + j], f)).join(' <span class="text-slate-400 font-bold">+</span> ');

      return {
        coefficients: finalCoeffs,
        reactants: rClean,
        products: pClean,
        rParsed,
        pParsed,
        allElements,
        atomCounts,
        balancedEquation: `${rStr} -> ${pStr}`,
        balancedEquationHtml: `${rHtml} <span class="text-cyan-400 font-bold mx-2">→</span> ${pHtml}`
      };
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        showToast("هاوکێشەکە کۆپی کرا!");
      }
    }

    function solveLinearAlgebraEquation(eq) {
      try {
        const parts = eq.split('=');
        if (parts.length !== 2) return null;

        function parseSide(side) {
          let s = side.replace(/\s+/g, '');
          s = s.replace(/([0-9xX])-/g, '$1+-');
          const terms = s.split('+').filter(Boolean);
          let a = 0;
          let b = 0;
          for (let t of terms) {
            if (/[xX]/.test(t)) {
              let coeffStr = t.replace(/[xX]/g, '');
              if (coeffStr === '' || coeffStr === '+') a += 1;
              else if (coeffStr === '-') a -= 1;
              else a += parseFloat(coeffStr);
            } else {
              b += parseFloat(t);
            }
          }
          return { a, b };
        }

        const left = parseSide(parts[0]);
        const right = parseSide(parts[1]);

        const totalA = left.a - right.a;
        const totalB = right.b - left.b;

        if (totalA === 0) {
          if (totalB === 0) return { status: 'infinite', msg: 'بێشومار شیکار هەیە' };
          return { status: 'none', msg: 'هیچ شیکارێکی نییە' };
        }

        const xVal = totalB / totalA;
        const formattedX = Number.isInteger(xVal) ? xVal : parseFloat(xVal.toFixed(4));
        return {
          status: 'ok',
          a: totalA,
          b: totalB,
          x: formattedX,
          original: eq,
          steps: [
            `هاوکێشەی سەرەتایی: ${eq}`,
            `کۆکردنەوەی هاوکۆڵکەکانی x لە لایەک: ${totalA}x = ${totalB}`,
            `دابەشکردنی هەردوو لا بەسەر (${totalA}): x = ${totalB} / ${totalA}`,
            `بەهای کۆتایی نەزانراو: x = ${formattedX}`
          ]
        };
      } catch (e) {
        return null;
      }
    }

    function evaluateArithmeticExpression(raw) {
      try {
        let str = raw.trim();
        let expr = str.replace(/(\d+)\s*[xX×]\s*(\d+)/g, '$1 * $2');
        expr = expr.replace(/×/g, '*').replace(/÷/g, '/');

        if (!/^[0-9\.\+\-\*/\(\)\s\^%]+$/.test(expr)) return null;

        const jsExpr = expr.replace(/\^/g, '**');
        const val = Function('"use strict"; return (' + jsExpr + ')')();
        if (typeof val !== 'number' || isNaN(val)) return null;

        const formattedVal = Number.isInteger(val) ? val : parseFloat(val.toFixed(4));
        const cleanDisplay = str.replace(/\*/g, '×').replace(/\//g, '÷');

        return {
          original: str,
          cleanDisplay: cleanDisplay,
          value: formattedVal
        };
      } catch (e) {
        return null;
      }
    }

    const LOWER_LETTERS = ['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','z','x','c','v','b','n','m'];

    const BIG_NUMBERS = ['1','2','3','4','5','6','7','8','9','0'];
    const SMALL_NUMBERS = ['₁','₂','₃','₄','₅','₆','₇','₈','₉','₀'];

    const SUBSCRIPT_TO_NORMAL = {
      '₀':'0', '₁':'1', '₂':'2', '₃':'3', '₄':'4',
      '₅':'5', '₆':'6', '₇':'7', '₈':'8', '₉':'9'
    };

    function cleanFormulaForBalancing(str) {
      if (!str) return '';
      str = str.replace(/\s*(?:⇌|⇄|<=>|<->)\s*/g, ' -> ');
      str = str.replace(/\s*\((?:s|l|g|aq|solid|liquid|gas|aqeous)\)/gi, '');
      str = str.replace(/[↑↓]/g, '');
      str = str.replace(/e\s*[⁻\-]/g, '');
      str = str.replace(/Δ/g, '');
      str = str.replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]*[⁺⁻]/g, '');
      str = normalizeSubscripts(str);
      return str.trim();
    }

    function normalizeSubscripts(str) {
      if (!str) return '';
      return str.replace(/[₀-₉]/g, ch => SUBSCRIPT_TO_NORMAL[ch] || ch);
    }

    function insertKey(textToInsert) {
      const input = document.getElementById('solverTextInput');
      if (!input) return;

      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      const val = input.value;

      input.value = val.substring(0, start) + textToInsert + val.substring(end);
      const newPos = start + textToInsert.length;
      input.setSelectionRange(newPos, newPos);
      input.focus();
    }

    function backspaceKey() {
      const input = document.getElementById('solverTextInput');
      if (!input) return;

      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      const val = input.value;

      if (start === end && start > 0) {
        input.value = val.substring(0, start - 1) + val.substring(end);
        input.setSelectionRange(start - 1, start - 1);
      } else if (start !== end) {
        input.value = val.substring(0, start) + val.substring(end);
        input.setSelectionRange(start, start);
      }
      input.focus();
    }

    let quizAnswersState = {};

    function renderQuizList() {
      const container = document.getElementById('quizListContainer');
      const badge = document.getElementById('quizScoreBadge');
      const list = getStoredQuizzes();

      let correctCount = 0;
      list.forEach(q => {
        if (quizAnswersState[q.id] !== undefined && quizAnswersState[q.id] === q.correct) {
          correctCount++;
        }
      });

      if (badge) badge.textContent = `نمرە: ${correctCount} لە ${list.length}`;
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full rounded-2xl bg-slate-900/50 border border-slate-800 p-6 text-center space-y-1.5">
            <p class="text-xs text-slate-400 font-medium">هیچ پرسیارێکی تاقیکردنەوە بڵاونەکراوەتەوە لە ئێستادا.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map((q, idx) => {
        const userAnswer = quizAnswersState[q.id];
        const isAnswered = userAnswer !== undefined;

        let optionsHtml = q.options.map((opt, optIdx) => {
          let btnStyle = "bg-slate-950 border-slate-800 text-slate-200 hover:border-cyan-500/50";
          if (isAnswered) {
            if (optIdx === q.correct) btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold";
            else if (optIdx === userAnswer && userAnswer !== q.correct) btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 font-bold";
            else btnStyle = "bg-slate-950/40 border-slate-800/40 text-slate-500";
          }

          return `
            <button onclick="handleSelectQuizAnswer('${q.id}', ${optIdx})" ${isAnswered ? 'disabled' : ''} class="w-full text-right p-2.5 rounded-xl border ${btnStyle} text-xs font-mono transition-all flex items-center justify-between">
              <span>${opt}</span>
              ${isAnswered && optIdx === q.correct ? '<span class="text-emerald-400 font-bold">✓ دروست</span>' : ''}
              ${isAnswered && optIdx === userAnswer && userAnswer !== q.correct ? '<span class="text-rose-400 font-bold">✗ هەڵە</span>' : ''}
            </button>
          `;
        }).join('');

        let feedbackHtml = '';
        if (isAnswered) {
          const isCorrect = userAnswer === q.correct;
          feedbackHtml = `
            <div class="p-3 rounded-xl ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-rose-950/40 border-rose-500/40 text-rose-300'} border text-[11px] leading-relaxed">
              <strong class="block mb-0.5">${isCorrect ? 'دەستخۆش! وەڵامەکەت تەواوە.' : 'وەڵامەکە هەڵەیە!'}</strong>
              <span>${q.explanation}</span>
            </div>
          `;
        }

        return `
          <div class="rounded-2xl bg-slate-900/80 border border-slate-800 p-3.5 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">پرسیاری ${idx + 1} • ${q.topic}</span>
              <span class="text-[10px] text-slate-500 font-mono">١ نمرە</span>
            </div>
            <div class="space-y-1">
              <p class="text-xs sm:text-sm font-bold text-white leading-snug">${q.kuQuestion}</p>
              ${q.enQuestion ? `<p class="text-[10px] sm:text-[11px] text-slate-400 font-mono ltr-dir">${q.enQuestion}</p>` : ''}
            </div>
            <div class="space-y-1.5">${optionsHtml}</div>
            ${feedbackHtml}
          </div>
        `;
      }).join('');
    }

      const countEl = document.getElementById('subCount');
      if (countEl) countEl.textContent = dbSubmissions.length;
      if (!container) return;

      if (dbSubmissions.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 py-3">تا ئێستا هیچ وەڵامێک لەلایەن قوتابیانەوە تۆمار نەکراوە.</p>';
        return;
      }

      container.innerHTML = dbSubmissions.map(sub => `
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-1.5 text-xs">
          <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="text-cyan-400 font-bold">${sub.studentName}</span>
              <span class="text-[10px] text-slate-500 font-mono">(${sub.studentId})</span>
            </div>
            <span class="text-[10px] text-slate-400 font-mono">${sub.submittedAt}</span>
          </div>
          <p><strong class="text-slate-400">ئەرک:</strong> <span class="text-slate-200">${sub.hwTitle}</span></p>
          <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-emerald-300 font-mono text-[11px] leading-relaxed">
            ${sub.answer}
          </div>
        </div>
      `).join('');
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const msgEl = document.getElementById('toastMessage');
      if (!toast || !msgEl) return;
      msgEl.textContent = msg;
      toast.classList.remove('hidden');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3200);
    }</script>
</body>
</html>
